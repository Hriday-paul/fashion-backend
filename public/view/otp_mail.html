<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Your verification code</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      color: #36344d;
    }

    .container {
      width: 100%;
      background-color: #ffffff;
      padding: 32px 0 40px;
    }

    .email-body {
      width: 100%;
      max-width: 552px;
      margin: 0 auto;
      padding: 0 20px;
      box-sizing: border-box;
    }

    .brand {
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 3px;
      color: #1d1e20;
      margin: 0 0 40px;
    }

    .title {
      font-size: 24px;
      line-height: 1.25;
      font-weight: bold;
      color: #1d1e20;
      margin: 0 0 28px;
    }

    .code-box {
      border: 1px solid #e3e5e8;
      border-radius: 16px;
      padding: 24px 25px;
      margin: 0 0 32px;
    }

    .code {
      margin: 0;
      font-size: 32px;
      line-height: 1.2;
      font-weight: bold;
      letter-spacing: 8px;
      color: #000000;
    }

    .text {
      font-size: 16px;
      line-height: 1.5;
      color: #36344d;
      margin: 0 0 22px;
    }

    .note {
      font-size: 14px;
      line-height: 1.5;
      color: #6d7081;
      margin: 0 0 36px;
    }

    .note strong {
      color: #6d7081;
    }

    .alert {
      width: 100%;
      border-collapse: separate;
      background-color: #f2f3f6;
      border-radius: 16px;
    }

    .alert td {
      padding: 26px 24px;
      vertical-align: middle;
    }

    .alert-text {
      font-size: 15px;
      line-height: 1.55;
      color: #36344d;
    }

    /* Headset icon built with CSS */
    .hs-band {
      width: 14px;
      height: 8px;
      margin: 0 auto;
      border: 3px solid #000000;
      border-bottom: 0;
      border-radius: 12px 12px 0 0;
    }

    .hs-cup {
      width: 5px;
      height: 9px;
      background-color: #000000;
      border-radius: 3px;
    }

    .thanks {
      font-size: 15px;
      line-height: 1.5;
      color: #36344d;
      margin: 40px 0 0;
    }

    .logo {
      /* text-align: center; */
      margin-bottom: 20px;
    }

    .logo img {
      width: 120px;
    }

    @media only screen and (max-width: 480px) {
      .title {
        font-size: 26px;
      }

      .code {
        font-size: 32px;
        letter-spacing: 5px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="email-body">

      <div class="logo">
        <img src="https://api.fashi-on.com/logo.png" alt="app Logo" />
      </div>

      <h1 class="title">Here is your verification code:</h1>

      <div class="code-box">
        <p class="code">{{otp}}</p>
      </div>

      <p class="text">Please make sure you never share this code with anyone.</p>

      <p class="note"><strong>Note:</strong> The code will expire in 3 minutes.</p>

      <table role="presentation" class="alert" cellpadding="0" cellspacing="0" border="0">
        <tr>
          <td width="28" style="padding-right: 0;">
            <div class="hs-band"></div>
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center"
              style="margin-top: -1px;">
              <tr>
                <td style="padding: 0;">
                  <div class="hs-cup"></div>
                </td>
                <td style="padding: 0; width: 8px;"></td>
                <td style="padding: 0;">
                  <div class="hs-cup"></div>
                </td>
              </tr>
            </table>
          </td>
          <td class="alert-text" style="padding-left: 16px;">
            <strong>Didn’t try to log in?</strong> Someone may know your password - change it in your account and
            contact support.
          </td>
        </tr>
      </table>

      <p class="thanks">Thank you for choosing Fa-shion.</p>

    </div>
  </div>
</body>

</html>
