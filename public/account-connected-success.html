<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Connected Successfully</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .success-card {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            text-align: center;
            width: 350px;
            animation: fadeIn 0.5s ease-in-out;
        }

        h2 {
            margin: 10px 0;
            color: #2e7d32;
        }

        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            background: #4CAF50;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            transition: 0.3s ease;
            font-size: 14px;
        }

        .btn:hover {
            background: #388E3C;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="success-card">
        <div>
            <img src="./success.gif" alt="success image" />
        </div>
        <h2>Account Connected Successfully!</h2>
        <p>Your payout account has been added successfully.</p>
    </div>

</body>

</html>
