<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Donation Successful</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      /* background: linear-gradient(160deg, #eafaf1 0%, #f6fef9 45%, #ffffff 100%); */
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .success-card {
      background: #fff;
      width: 100%;
      max-width: 420px;
      padding: 44px 34px 36px;
      border-radius: 20px;
      text-align: center;
      /* box-shadow: 0 20px 45px -18px rgba(20, 100, 60, 0.25); */
      animation: fadeIn 0.6s ease-in-out;
    }

    .checkmark {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: #2ecc71;
      box-shadow: 0 0 0 8px rgba(46, 204, 113, 0.12);
      margin: 0 auto 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      animation: pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.15s both;
    }

    .checkmark::after {
      content: "";
      width: 22px;
      height: 40px;
      border-right: 5px solid #fff;
      border-bottom: 5px solid #fff;
      transform: rotate(45deg);
      position: absolute;
      top: 10px;
      opacity: 0;
      animation: draw 0.4s ease 0.5s forwards;
    }

    h1 {
      font-size: 25px;
      font-weight: 700;
      color: #1b1b1b;
      margin-bottom: 10px;
    }

    p {
      color: #6b7280;
      font-size: 15px;
      line-height: 1.65;
      margin-bottom: 6px;
    }

    .impact {
      font-size: 14px;
      color: #2e9e5b;
      font-weight: 500;
      background: #f0fbf4;
      border: 1px solid #d7f3e3;
      border-radius: 12px;
      padding: 12px 16px;
      margin: 20px 0 28px;
    }

    .btn {
      display: inline-block;
      width: 100%;
      padding: 14px 20px;
      background: #2ecc71;
      color: #fff;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      transition: background 0.25s ease, transform 0.15s ease;
    }

    .btn:hover {
      background: #27ae60;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .secondary-link {
      display: inline-block;
      margin-top: 16px;
      font-size: 13.5px;
      color: #9ca3af;
      text-decoration: none;
    }

    .secondary-link:hover {
      color: #6b7280;
      text-decoration: underline;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pop {
      from {
        transform: scale(0.6);
        opacity: 0;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    @keyframes draw {
      from {
        opacity: 0;
        height: 0;
      }
      to {
        opacity: 1;
        height: 40px;
      }
    }
  </style>
</head>
<body>

  <div class="success-card">
    <div class="checkmark"></div>

    <h1>Thank You for Your Generosity!</h1>
    <p>
      Your donation has been received successfully.
    </p>

    <div class="impact">
      🌱 Your contribution helps us keep making a real difference.
    </div>

    <a href="http://localhost:5001" class="btn">Go to Website</a>
    
  </div>

</body>
</html>
